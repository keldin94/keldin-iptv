name: Build Keldin IPTV v0.6.1 hotfix APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: keldin-iptv-hotfix-v061
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project sources and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part00 source-parts/part01 source-parts/part02 source-parts/part03 source-parts/part04 > /tmp/keldin-source.b64
          test "$(wc -c < /tmp/keldin-source.b64)" -eq 31120
          echo "b272167f04a2b0e5888004d133acd166ac0ed6be2645dbe89dfd2682ee9e5889  /tmp/keldin-source.b64" | sha256sum -c -
          base64 --decode /tmp/keldin-source.b64 > /tmp/keldin-source.tar.xz
          echo "72757dbc9247c465c9eb46d4a6151bf9c66861b45f38c45651cef122f9142685  /tmp/keldin-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/keldin-source.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform with runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test M3U, EPG and Xtream URL parsing
        run: bash tests/run_smoke_test.sh

      - name: Fix GuideAdapter view holder field names
        run: |
          sed -i 's/h\.nowName/h.now/g; s/h\.nextName/h.next/g' app/src/main/java/com/keldin/iptv/ui/GuideAdapter.java

      - name: Apply playback compatibility and diagnostics patch
        run: python3 patches/fix_player.py

      - name: Add K + Play icon and server format diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/StreamProbe.java app/src/main/java/com/keldin/iptv/playback/StreamProbe.java
          python3 patches/fix_stream_v3.py
          cp patches/keldin_icon.xml app/src/main/res/drawable/keldin_icon.xml
          cp patches/keldin_banner.xml app/src/main/res/drawable/keldin_banner.xml

      - name: Add TV channel/category/EPG overlay and remote exit confirmation
        shell: bash
        run: |
          set -euo pipefail
          cp patches/TvSidePanel.java app/src/main/java/com/keldin/iptv/playback/TvSidePanel.java
          python3 patches/overlay_v4.py

      - name: Apply redesigned main UI, logo fixes and crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/LogoLoaderV5.java app/src/main/java/com/keldin/iptv/ui/LogoLoader.java
          cp patches/CategoryAdapterV5.java app/src/main/java/com/keldin/iptv/ui/CategoryAdapter.java
          cp patches/CrashReporterV5.java app/src/main/java/com/keldin/iptv/ui/CrashReporter.java
          python3 patches/v5_catalog_theme.py
          python3 patches/v5_main.py

      - name: Add v0.6 import wizard, posters and multilingual UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp patches/PlaylistWizardV6.java app/src/main/java/com/keldin/iptv/net/PlaylistWizardV6.java
          cp patches/PosterAdapterV6.java app/src/main/java/com/keldin/iptv/ui/PosterAdapterV6.java
          cp patches/I18nV6.java app/src/main/java/com/keldin/iptv/ui/I18n.java
          cp patches/SettingsBackupV6.java app/src/main/java/com/keldin/iptv/ui/SettingsBackupV6.java
          cp patches/SeriesBrowserV6.java app/src/main/java/com/keldin/iptv/ui/SeriesBrowserV6.java
          python3 patches/v6_core.py
          python3 patches/v6_main.py
          python3 patches/v6_settings.py
          python3 patches/v6_adapters.py
          python3 patches/v6_player.py
          python3 patches/v6_localize.py
          python3 patches/v6_polish.py

      - name: Fix huge playlist import and remaining language labels
        shell: bash
        run: |
          set -euo pipefail
          cp patches/CategoryScanV61.java app/src/main/java/com/keldin/iptv/net/CategoryScanV61.java
          cp patches/PlaylistWizardV61.java app/src/main/java/com/keldin/iptv/net/PlaylistWizardV6.java
          python3 patches/v61_parser.py
          python3 patches/v61_release.py
          python3 tests/audit_ui_language_v61.py

      - name: Test 170K-item playlist with country filtering
        run: bash tests/run_v61_tests.sh

      - name: Load licensed Inter typeface (fall back to Android sans-serif)
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 15 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf' \
            -o app/src/main/assets/inter_regular.ttf || rm -f app/src/main/assets/inter_regular.ttf
          test ! -f app/src/main/assets/inter_regular.ttf || test "$(wc -c < app/src/main/assets/inter_regular.ttf)" -gt 20000
          curl -fsSL --max-time 15 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt' \
            -o app/src/main/assets/INTER_LICENSE.txt || true

      - name: Test large playlists, categories and radio
        run: bash tests/run_v6_tests.sh

      - name: Build Android TV debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Keldin-IPTV-Full-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.6.1 large playlist hotfix APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk keldin-v0.6.1.apk
          if ! gh release view v0.6.1-test --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create v0.6.1-test \
              --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "Keldin IPTV v0.6.1 — Large Playlist Import Hotfix" \
              --notes "Android TV beta v0.6.1 fixes 150000-entry import rejection: download once to temporary local file, scan country groups with bounded RAM, filter before retaining Channel data. Default import dialog English. Hardware playback still needs user verification." \
              --prerelease
          fi
          gh release upload v0.6.1-test keldin-v0.6.1.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber
