name: Build Keldin IPTV Android TV
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_stable:
        description: "Publish signed stable release (requires 4 signing secrets)"
        required: false
        type: boolean
        default: false

concurrency:
  group: keldin-iptv-stable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project sources and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part00 source-parts/part01 source-parts/part02 source-parts/part03 source-parts/part04 > /tmp/keldin-source.b64
          test "$(wc -c < /tmp/keldin-source.b64)" -eq 31120
          echo "b272167f04a2b0e5888004d133acd166ac0ed6be2645dbe89dfd2682ee9e5889  /tmp/keldin-source.b64" | sha256sum -c -
          base64 --decode /tmp/keldin-source.b64 > /tmp/keldin-source.tar.xz
          echo "72757dbc9247c465c9eb46d4a6151bf9c66861b45f38c45651cef122f9142685  /tmp/keldin-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/keldin-source.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform with runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test M3U, EPG and Xtream URL parsing
        run: bash tests/run_smoke_test.sh

      - name: Fix GuideAdapter view holder field names
        run: |
          sed -i 's/h\.nowName/h.now/g; s/h\.nextName/h.next/g' app/src/main/java/com/keldin/iptv/ui/GuideAdapter.java

      - name: Apply playback compatibility and diagnostics patch
        run: python3 patches/fix_player.py

      - name: Add K + Play icon and server format diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/StreamProbe.java app/src/main/java/com/keldin/iptv/playback/StreamProbe.java
          python3 patches/fix_stream_v3.py
          cp patches/keldin_icon.xml app/src/main/res/drawable/keldin_icon.xml
          cp patches/keldin_banner.xml app/src/main/res/drawable/keldin_banner.xml

      - name: Add TV channel/category/EPG overlay and remote exit confirmation
        shell: bash
        run: |
          set -euo pipefail
          cp patches/TvSidePanel.java app/src/main/java/com/keldin/iptv/playback/TvSidePanel.java
          python3 patches/overlay_v4.py

      - name: Apply redesigned main UI, logo fixes and crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/LogoLoaderV5.java app/src/main/java/com/keldin/iptv/ui/LogoLoader.java
          cp patches/CategoryAdapterV5.java app/src/main/java/com/keldin/iptv/ui/CategoryAdapter.java
          cp patches/CrashReporterV5.java app/src/main/java/com/keldin/iptv/ui/CrashReporter.java
          python3 patches/v5_catalog_theme.py
          python3 patches/v5_main.py

      - name: Add v0.6 import wizard, posters and multilingual UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp patches/PlaylistWizardV6.java app/src/main/java/com/keldin/iptv/net/PlaylistWizardV6.java
          cp patches/PosterAdapterV6.java app/src/main/java/com/keldin/iptv/ui/PosterAdapterV6.java
          cp patches/I18nV6.java app/src/main/java/com/keldin/iptv/ui/I18n.java
          cp patches/SettingsBackupV6.java app/src/main/java/com/keldin/iptv/ui/SettingsBackupV6.java
          cp patches/SeriesBrowserV6.java app/src/main/java/com/keldin/iptv/ui/SeriesBrowserV6.java
          python3 patches/v6_core.py
          python3 patches/v6_main.py
          python3 patches/v6_settings.py
          python3 patches/v6_adapters.py
          python3 patches/v6_player.py
          python3 patches/v6_localize.py
          python3 patches/v6_polish.py

      - name: Fix huge playlist import and remaining language labels
        shell: bash
        run: |
          set -euo pipefail
          cp patches/CategoryScanV61.java app/src/main/java/com/keldin/iptv/net/CategoryScanV61.java
          cp patches/PlaylistWizardV61.java app/src/main/java/com/keldin/iptv/net/PlaylistWizardV6.java
          python3 patches/v61_parser.py
          python3 patches/v61_release.py
          python3 patches/v61_english_ui.py
          python3 tests/audit_ui_language_v61.py

      - name: Add in-app updater and stable signing setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/keldin/iptv/updates app/src/main/res/xml
          cp patches/AppUpdateManagerV7.java app/src/main/java/com/keldin/iptv/updates/AppUpdateManager.java
          cp patches/UpdateVersionV7.java app/src/main/java/com/keldin/iptv/updates/UpdateVersion.java
          cp patches/update_paths_v7.xml app/src/main/res/xml/update_paths.xml
          python3 patches/v7_updater_integration.py

      - name: Expand playlist capacity and keep country selection
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/v8_large_playlist.py

      - name: Improve IPTV connection reliability and category chooser for v0.8.1
        shell: bash
        run: |
          set -euo pipefail
          cp patches/PlaylistImportHttpV81.java app/src/main/java/com/keldin/iptv/net/PlaylistImportHttpV81.java
          python3 patches/v81_network_and_chooser.py

      - name: Upgrade player overlays, EPG, settings tabs and localization
        shell: bash
        run: |
          set -euo pipefail
          cp patches/UiLocaleV9.java app/src/main/java/com/keldin/iptv/ui/UiLocaleV9.java
          python3 patches/v9_i18n.py
          python3 patches/v9_panel.py
          python3 patches/v9_player.py
          python3 patches/v9_epg.py
          python3 patches/v9_settings.py
          python3 patches/v9_player_localize.py
          python3 patches/v9_network.py
          python3 patches/v9_localization_privacy.py
          python3 patches/v9_version.py

      - name: Compact TV playback information and improve buffer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/PlaybackDiagnosticsV91.java app/src/main/java/com/keldin/iptv/playback/PlaybackDiagnosticsV91.java
          python3 patches/v91_compact_overlay.py
          python3 patches/v91_playback.py
          python3 patches/v91_version.py

      - name: Test v0.9.1 overlay, watchdog and preserved update identity
        run: bash tests/run_v91_regression.sh

      - name: Audit live playback buffer lifecycle before v0.9.1 improvements
        run: python3 tests/v91_playback_audit.py

      - name: Test v0.9 TV remote, EPG autodetection, languages and tab settings
        run: bash tests/run_v9_tv_ux_tests.sh

      - name: Test retry after timeout and navigable TV category checkboxes
        run: bash tests/run_v81_import_tests.sh

      - name: Test the real-size 183104-item M3U import
        run: bash tests/run_v8_large_playlist.sh

      - name: Test updater version ordering and installer manifest
        run: bash tests/run_update_v7_tests.sh

      - name: Test 170K-item playlist with country filtering
        run: bash tests/run_v61_tests.sh

      - name: Load licensed Inter typeface (fall back to Android sans-serif)
        shell: bash
        run: |
          curl -fsSL --retry 2 --max-time 15 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf' \
            -o app/src/main/assets/inter_regular.ttf || rm -f app/src/main/assets/inter_regular.ttf
          test ! -f app/src/main/assets/inter_regular.ttf || test "$(wc -c < app/src/main/assets/inter_regular.ttf)" -gt 20000
          curl -fsSL --max-time 15 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt' \
            -o app/src/main/assets/INTER_LICENSE.txt || true

      - name: Test large playlists, categories and radio
        run: bash tests/run_v6_tests.sh

      - name: Build Android TV debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Keldin-IPTV-current-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify persistent-signing release build with disposable CI test key
        shell: bash
        run: |
          set -euo pipefail
          TEMP_KEY="${RUNNER_TEMP}/keldin-ci-test-keystore.jks"
          TEMP_PASS="$(openssl rand -hex 20)"
          keytool -genkeypair -noprompt \
            -keystore "${TEMP_KEY}" -alias ci-test \
            -storepass "${TEMP_PASS}" -keypass "${TEMP_PASS}" \
            -dname "CN=Keldin CI Signing Verification" \
            -keyalg RSA -keysize 2048 -validity 365
          export KELDIN_SIGNING_FILE="${TEMP_KEY}"
          export KELDIN_SIGNING_STORE_PASSWORD="${TEMP_PASS}"
          export KELDIN_SIGNING_ALIAS="ci-test"
          export KELDIN_SIGNING_KEY_PASSWORD="${TEMP_PASS}"
          gradle --no-daemon --stacktrace :app:assembleRelease
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "${SIGNER}" verify --verbose app/build/outputs/apk/release/app-release.apk
          APK_DUMP="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "${APK_DUMP}" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='com.keldin.iptv'"
          rm -f "${TEMP_KEY}"
          echo "Stable release Gradle signing verified with disposable key (NOT for production)."

      - name: Sign and publish stable release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_stable) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KELDIN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KELDIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KELDIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KELDIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KELDIN_KEYSTORE_BASE64 secret}"
          : "${STORE_PASSWORD:?Missing KELDIN_KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KELDIN_KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KELDIN_KEY_PASSWORD secret}"

          export KELDIN_SIGNING_FILE="${RUNNER_TEMP}/keldin-release.jks"
          export KELDIN_SIGNING_STORE_PASSWORD="${STORE_PASSWORD}"
          export KELDIN_SIGNING_ALIAS="${KEY_ALIAS}"
          export KELDIN_SIGNING_KEY_PASSWORD="${KEY_PASSWORD}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KELDIN_SIGNING_FILE}"
          chmod 600 "${KELDIN_SIGNING_FILE}"
          # A disposable CI test key was used above. Rebuild cleanly to guarantee
          # the published binary uses only the user's permanent signing key.
          gradle --no-daemon --stacktrace clean :app:assembleRelease

          cp app/build/outputs/apk/release/app-release.apk keldin-iptv.apk
          SIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "${SIGNER}" verify --verbose keldin-iptv.apk
          sha256sum keldin-iptv.apk > keldin-iptv.apk.sha256

          APK_DUMP="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          PACKAGE_LINE="$("${APK_DUMP}" dump badging keldin-iptv.apk | grep "^package:")"
          printf '%s\n' "${PACKAGE_LINE}" | grep -q "name='com.keldin.iptv'"
          APP_VERSION="$(printf '%s\n' "${PACKAGE_LINE}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "${APP_VERSION}"
          VERSION="v${APP_VERSION}"
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Stable release ${VERSION} already exists. Refusing to replace a signed public APK."
            exit 1
          fi
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Keldin IPTV ${APP_VERSION} — Android TV" \
            --notes "Stable Android TV release. Signed with the permanent Keldin key. In-app updates from newer stable versions preserve playlists and favorites. Imported IPTV playlists can be over 183104 entries; users can select countries before saving." \
            keldin-iptv.apk keldin-iptv.apk.sha256
          rm -f "${KELDIN_SIGNING_FILE}"
