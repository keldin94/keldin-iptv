name: Build Keldin IPTV v0.3 Android TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: keldin-iptv-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project sources and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part00 source-parts/part01 source-parts/part02 source-parts/part03 source-parts/part04 > /tmp/keldin-source.b64
          test "$(wc -c < /tmp/keldin-source.b64)" -eq 31120
          echo "b272167f04a2b0e5888004d133acd166ac0ed6be2645dbe89dfd2682ee9e5889  /tmp/keldin-source.b64" | sha256sum -c -
          base64 --decode /tmp/keldin-source.b64 > /tmp/keldin-source.tar.xz
          echo "72757dbc9247c465c9eb46d4a6151bf9c66861b45f38c45651cef122f9142685  /tmp/keldin-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/keldin-source.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform with runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test M3U, EPG and Xtream URL parsing
        run: bash tests/run_smoke_test.sh

      - name: Fix GuideAdapter view holder field names
        run: |
          sed -i 's/h\.nowName/h.now/g; s/h\.nextName/h.next/g' app/src/main/java/com/keldin/iptv/ui/GuideAdapter.java

      - name: Apply playback compatibility and diagnostics patch
        run: python3 patches/fix_player.py

      - name: Add K + Play icon and server format diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp patches/StreamProbe.java app/src/main/java/com/keldin/iptv/playback/StreamProbe.java
          python3 patches/fix_stream_v3.py
          cp patches/keldin_icon.xml app/src/main/res/drawable/keldin_icon.xml
          cp patches/keldin_banner.xml app/src/main/res/drawable/keldin_banner.xml

      - name: Build Android TV debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Keldin-IPTV-Full-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.3.0 stream probe APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk keldin-v0.3.apk
          if ! gh release view v0.3.0-test --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create v0.3.0-test \
              --repo "${GITHUB_REPOSITORY}" \
              --target main \
              --title "Keldin IPTV v0.3.0 — Stream diagnostics + K Play icon (Android TV)" \
              --notes "Testna verzija: provjera HTTP odgovora i HLS/MPEG-TS formata na uredjaju, novi K + Play TV logo, zadrzana VLC opcija. Nije testirana na stvarnom Xiaomi Boxu." \
              --prerelease
          fi
          gh release upload v0.3.0-test keldin-v0.3.apk \
            --repo "${GITHUB_REPOSITORY}" --clobber
